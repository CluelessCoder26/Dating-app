name: Backend CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: spark
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Set up environment
      working-directory: ./backend
      run: |
        echo "DATABASE_URL=postgresql://postgres:password@localhost:5432/spark" >> .env
        echo "DIRECT_URL=postgresql://postgres:password@localhost:5432/spark" >> .env
        echo "REDIS_URL=redis://localhost:6379" >> .env
        echo "JWT_SECRET=testsecret" >> .env
        echo "NODE_ENV=test" >> .env

    - name: Prisma Generate and Push
      working-directory: ./backend
      run: |
        npx prisma generate
        npx prisma db push --accept-data-loss

    - name: Run Tests
      working-directory: ./backend
      run: npm run test

    - name: Build Docker Image
      working-directory: ./backend
      run: docker build -t spark-backend:latest .
