apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: spark-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: spark-worker:latest
          command: ["npm", "run", "worker"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
