version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build: .
    ports:
      - "5000:5000"
      - "5011:5011"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - WEBSOCKET_PORT=5011
      - DATABASE_URL=postgresql://postgres:password@host.docker.internal:5432/spark
      - DIRECT_URL=postgresql://postgres:password@host.docker.internal:5432/spark
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=spark_jwt_secret
      - USE_REDIS=true
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
